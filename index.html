<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiru Energy — Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--blue:#00a4ff;--blue-deep:#0086d4;--navy:#021431;--green:#1faa6b;--amber:#e08a1e;--red:#d9534f;--radius:14px;--bg:#eef3f9;
    --page-grad:radial-gradient(1000px 500px at 92% -10%, rgba(0,164,255,.10), transparent 60%);
    --card-bg:#fff;--line:#e3e9f1;--text:#021431;--muted:#6a7685;--soft:#f4f7fb;--tag-bg:rgba(0,164,255,.07);--card-shadow:0 14px 40px -26px rgba(2,20,49,.4)}
  [data-theme="dark"]{--bg:#060f1d;--page-grad:radial-gradient(1000px 500px at 92% -10%, rgba(0,164,255,.16), transparent 60%);
    --card-bg:#0e1c33;--line:#1d3052;--text:#e8f0fb;--muted:#90a4c0;--soft:#0a1729;--tag-bg:rgba(0,164,255,.14);--card-shadow:0 18px 50px -28px rgba(0,0,0,.85)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;background-image:var(--page-grad);background-attachment:fixed}
  .wrap{max-width:1500px;margin:0 auto;padding:24px 20px 70px}
  header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:16px}.brand img{height:40px;display:block}
  .brand .divider{width:1px;height:32px;background:var(--line)}
  .brand .ttl{font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
  .brand .ttl span{display:block;font-weight:500;font-size:.74rem;color:var(--muted);margin-top:2px}
  .hcluster{display:flex;align-items:center;gap:10px}
  .tag{font-size:.64rem;text-transform:uppercase;letter-spacing:.14em;color:var(--blue-deep);font-weight:700;border:1px solid rgba(0,164,255,.4);padding:6px 12px;border-radius:999px;background:var(--tag-bg);white-space:nowrap}
  .themebtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card-bg);color:var(--text);cursor:pointer;flex:none}
  .themebtn:hover{border-color:var(--blue);color:var(--blue-deep)}.themebtn svg{width:17px;height:17px}
  .icon-sun{display:none}[data-theme="dark"] .icon-sun{display:block}[data-theme="dark"] .icon-moon{display:none}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .tabbtn{font-family:inherit;font-size:.83rem;font-weight:700;color:var(--muted);background:var(--card-bg);border:1px solid var(--line);border-radius:10px;padding:9px 15px;cursor:pointer}
  .tabbtn:hover{border-color:var(--blue);color:var(--blue-deep)}
  .tabbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
  [data-theme="dark"] .tabbtn.on{background:var(--blue);color:#04121f;border-color:var(--blue)}
  .card{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--card-shadow)}
  .pad{padding:18px}
  h2{font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;color:var(--blue-deep);margin-bottom:12px}
  h3{font-size:1rem;font-weight:800;margin-bottom:3px}
  .sub{font-size:.78rem;color:var(--muted);margin-bottom:14px}
  .lab{font-size:.76rem;font-weight:600;display:block;margin-bottom:4px}
  .lab small{font-weight:400;color:var(--muted)}
  input,select,textarea{width:100%;font-family:inherit;font-size:.85rem;font-weight:600;color:var(--text);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 11px;-moz-appearance:textfield}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,164,255,.16)}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  textarea{min-height:54px;font-weight:500;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
  .mb{margin-bottom:11px}
  .btn{font-family:inherit;font-size:.84rem;font-weight:700;cursor:pointer;border-radius:9px;padding:10px 16px;border:1px solid transparent;background:var(--blue);color:#04121f}
  .btn:hover{background:var(--blue-deep)}
  .btn.ghost{background:var(--card-bg);color:var(--text);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue-deep)}
  .btn.warn{background:var(--amber);color:#2a1a00}
  .btn.danger{background:var(--card-bg);color:var(--red);border-color:var(--line)}
  .btn.danger:hover{border-color:var(--red)}
  .btn.sm{font-size:.74rem;padding:7px 11px}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
  @media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
  .kc{background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--card-shadow)}
  .kc.dark{background:var(--navy);border-color:var(--navy)}
  .kc .l{font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
  .kc.dark .l{color:#8aa9c4}
  .kc .v{font-size:1.5rem;font-weight:800;margin-top:4px;line-height:1.1}
  .kc.dark .v{color:var(--blue)}
  .kc .x{font-size:.68rem;color:var(--muted);margin-top:2px}
  table.grid{width:100%;border-collapse:collapse}
  table.grid th{background:var(--soft);color:var(--muted);font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}
  table.grid th.l{text-align:left}table.grid th.c{text-align:center}
  table.grid td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:.83rem;text-align:right;font-variant-numeric:tabular-nums}
  table.grid td.l{text-align:left;font-weight:600}table.grid td.c{text-align:center}
  table.grid tr:hover td{background:var(--soft)}
  .pill{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:5px;color:#fff}
  .pill.ok{background:var(--green)}.pill.low{background:var(--amber)}.pill.out{background:var(--red)}
  .pill.draft{background:var(--muted)}.pill.done{background:var(--green)}.pill.in{background:var(--blue-deep)}.pill.outv{background:var(--amber)}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:.85rem;font-style:italic}
  .linehead,.lineitem{display:grid;gap:7px;align-items:center}
  .linehead.cols-po,.lineitem.cols-po{grid-template-columns:1fr 70px 110px 32px}
  .linehead.cols-mro,.lineitem.cols-mro{grid-template-columns:1fr 55px 80px 100px 32px}
  .linehead span{font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .linehead span:not(:first-child){text-align:center}
  .lineitem{margin-bottom:7px}.lineitem .num{text-align:right}
  .delbtn{width:32px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .delbtn:hover{border-color:var(--red);color:var(--red)}.delbtn svg{width:14px;height:14px}
  .upbtn{display:inline-block;font-size:.76rem;font-weight:700;color:var(--blue-deep);cursor:pointer;border:1px dashed var(--line);border-radius:8px;padding:9px 13px}
  .upbtn:hover{border-color:var(--blue)}
  .upthumb{display:none;margin-top:8px;max-height:52px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:4px}
  .upthumb.show{display:block}
  .split{display:grid;grid-template-columns:400px 1fr;gap:18px;align-items:start}
  @media(max-width:1100px){.split{grid-template-columns:1fr}}
  .stick{position:sticky;top:16px}
  @media(max-width:1100px){.stick{position:static}}
  .banner{display:flex;gap:10px;align-items:flex-start;background:var(--tag-bg);border:1px solid rgba(0,164,255,.35);border-radius:10px;padding:11px 13px;font-size:.78rem;color:var(--text);margin-bottom:14px;line-height:1.45}
  .banner b{color:var(--blue-deep)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:.84rem;font-weight:700;padding:12px 20px;border-radius:10px;box-shadow:0 14px 40px -18px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .modal{position:fixed;inset:0;background:rgba(2,20,49,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:80}
  .modal.show{display:flex}
  .modal .inner{background:var(--card-bg);border-radius:14px;max-width:520px;width:100%;padding:22px;box-shadow:0 30px 70px -30px rgba(0,0,0,.6)}
  .searchbar{display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap}
  .searchbar input,.searchbar select{max-width:230px}
  .docwrap{background:#fff;color:#021431;border:1px solid var(--line);border-radius:10px;padding:30px 32px;font-size:12.5px}
  .doc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid #021431;padding-bottom:16px}
  .doc-top img{height:42px}
  .doc-co{font-size:10.5px;color:#56657a;margin-top:7px;line-height:1.5}
  .doc-t{text-align:right}
  .doc-t .t{font-size:24px;font-weight:800;letter-spacing:.03em;color:#021431}
  .doc-t .m{font-size:11px;color:#56657a;margin-top:7px;line-height:1.65}.doc-t .m b{color:#021431}
  .doc-parties{display:flex;gap:30px;margin-top:18px}
  .doc-party{flex:1}
  .doc-party .h{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:#00a4ff;font-weight:800;margin-bottom:5px}
  .doc-party .v{font-size:12.5px;font-weight:700}
  .doc-party .s{font-size:11px;color:#56657a;margin-top:2px}
  table.doc{width:100%;border-collapse:collapse;margin-top:18px;table-layout:fixed}
  table.doc th{background:#021431;color:#fff;font-size:9px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:8px 9px;text-align:right}
  table.doc th.l{text-align:left}table.doc th.c{text-align:center}
  table.doc td{padding:8px 9px;border-bottom:1px solid #eaeef4;font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
  table.doc td.l{text-align:left;font-weight:600;word-break:break-word}
  table.doc td.c{text-align:center;color:#56657a}
  table.doc tr.tot td{background:#021431;color:#fff;font-weight:800;font-size:12px;border:none}
  .doc-sign{display:flex;justify-content:space-between;gap:30px;margin-top:26px;padding-top:18px;border-top:1px solid #eaeef4}
  .doc-note{flex:1;font-size:11px;color:#41526a;line-height:1.5;white-space:pre-line}
  .doc-note .h{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:#00a4ff;font-weight:800;margin-bottom:5px}
  .doc-sg{text-align:center;min-width:230px}
  .doc-sg .h{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:#00a4ff;font-weight:800;margin-bottom:5px}
  .doc-sg .slot{height:54px;display:flex;align-items:flex-end;justify-content:center}
  .doc-sg img{max-height:54px;max-width:200px}
  .doc-sg .ln{border-top:1.4px solid #021431;margin-top:2px;padding-top:5px;font-size:12px;font-weight:700}
  .doc-sg .rl{font-size:10px;color:#56657a;font-weight:500}
  .doc-foot{margin-top:20px;border-top:1px solid #eaeef4;padding-top:11px;text-align:center;font-size:10px;color:#8392a5}
  .rep-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:14px}
  .rep-kpi .c{border:1px solid #e6ebf1;border-radius:10px;padding:11px 13px;background:#f7fafd}
  .rep-kpi .c.dk{background:#021431;border-color:#021431}
  .rep-kpi .c .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:#56657a;font-weight:700}
  .rep-kpi .c.dk .l{color:#8aa9c4}
  .rep-kpi .c .v{font-size:17px;font-weight:800;color:#021431;margin-top:3px}
  .rep-kpi .c.dk .v{color:#00a4ff}
  .rep-h{font-size:12px;font-weight:800;color:#021431;display:flex;align-items:center;gap:8px;margin:20px 0 9px}
  .rep-h::before{content:"";width:4px;height:14px;background:#00a4ff;border-radius:3px}
  .gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);background-image:var(--page-grad);z-index:70}
  .gate.hide{display:none}
  .gatecard{background:var(--card-bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--card-shadow);padding:26px;max-width:380px;width:100%}
  .gatelogo{height:38px;display:block}
  .gatemsg{font-size:.78rem;margin-top:11px;text-align:center;color:var(--red);font-weight:600;min-height:18px}
  .userchip{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:700;color:var(--muted);background:var(--card-bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .userchip button{font-family:inherit;font-size:.72rem;font-weight:700;color:var(--blue-deep);background:none;border:none;cursor:pointer;padding:0}
  .syncdot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
  .syncdot.off{background:var(--amber)}
  /* ---- home page ---- */
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:24px}
  .module-card{background:var(--card-bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--card-shadow);padding:28px 26px;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
  .module-card:hover{border-color:var(--blue);box-shadow:0 18px 50px -28px rgba(0,164,255,.45)}
  .module-card .mc-badge{display:inline-block;font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;padding:4px 10px;border-radius:999px;margin-bottom:14px}
  .mc-badge.lif{background:rgba(31,170,107,.14);color:var(--green)}
  .mc-badge.company{background:var(--tag-bg);color:var(--blue-deep)}
  .module-card h2{font-size:1.18rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;color:var(--text)}
  .module-card .mc-desc{font-size:.8rem;color:var(--muted);line-height:1.5;margin-bottom:18px}
  .module-card .mc-tools{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
  .mc-tool{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:9px;background:var(--soft);border:1px solid var(--line);text-decoration:none;transition:border-color .15s,box-shadow .15s}
  .mc-tool .ic{font-size:.92rem;line-height:1.3;flex:none}
  .mc-tool .tx{min-width:0}
  .mc-tool .nm{font-size:.76rem;font-weight:700;color:var(--muted)}
  .mc-tool .ds{font-size:.68rem;color:var(--muted);opacity:.75;margin-top:1px;line-height:1.35}
  .mc-tool.active .nm{color:var(--blue-deep)}
  .mc-tool.active{border-color:rgba(0,164,255,.3)}
  a.mc-tool.active:hover{border-color:var(--blue);box-shadow:0 6px 16px -10px rgba(0,164,255,.5)}
  .mc-tool.soon{opacity:.55}
  .homebrand{font-weight:800;font-size:1rem;letter-spacing:-.02em}
  .homebrand span{display:block;font-size:.72rem;font-weight:500;color:var(--muted);margin-top:2px}
  .mod-label{font-size:.72rem;font-weight:700;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--muted);white-space:nowrap}
  .mod-label.lif-label{background:rgba(31,170,107,.12);border-color:rgba(31,170,107,.4);color:var(--green)}
  .mod-label.company-label{background:var(--tag-bg);border-color:rgba(0,164,255,.4);color:var(--blue-deep)}
  .homebtn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:.76rem;font-weight:700;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card-bg);color:var(--muted);cursor:pointer;white-space:nowrap}
  .homebtn:hover{border-color:var(--blue);color:var(--blue-deep)}
  #printArea{display:none}
  @page{size:A4 portrait;margin:11mm}
  @media print{
    body{background:#fff!important;background-image:none!important}
    .wrap,header,nav.tabs,.no-print,.toast,.modal{display:none!important}
    #printArea{display:block!important}
    #printArea .docwrap{border:none;border-radius:0;padding:0;font-size:10pt}
    .doc-top,table.doc th,table.doc tr.tot td,.rep-kpi .c,.rep-kpi .c.dk{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    table.doc{page-break-inside:auto}table.doc thead{display:table-header-group}table.doc tr{page-break-inside:avoid}
    .avoid-break{break-inside:avoid;page-break-inside:avoid}
    .land{page-break-before:auto}
  }
  @media print{ body.landscape{} }
</style>

<body>

    <h3 style="margin-top:14px">Kiru Workspace</h3>
    <div class="sub">Sign in with your Kiru team account.</div>
    <div id="gateWarn"></div>
    <!-- tab switcher -->
    <div style="display:flex;gap:0;margin-bottom:18px;border:1px solid var(--line);border-radius:10px;overflow:hidden">
      <button id="tab_signin" onclick="gateTab('signin')" style="flex:1;font-family:inherit;font-size:.82rem;font-weight:700;padding:9px 0;border:none;cursor:pointer;background:var(--navy);color:#fff;transition:background .15s">Sign in</button>
      <button id="tab_signup" onclick="gateTab('signup')" style="flex:1;font-family:inherit;font-size:.82rem;font-weight:700;padding:9px 0;border:none;cursor:pointer;background:var(--card-bg);color:var(--muted);transition:background .15s">Create account</button>
    </div>
    <!-- sign-in panel -->
    <div id="panel_signin">
      <div class="mb"><span class="lab">Email</span><input type="email" id="g_email" autocomplete="username"></div>
      <div class="mb"><span class="lab">Password</span><input type="password" id="g_pass" autocomplete="current-password"></div>
      <button class="btn" id="g_in" style="width:100%">Sign in</button>
    </div>
    <!-- create account panel -->
    <div id="panel_signup" style="display:none">
      <div class="mb"><span class="lab">Work email <small>(@ourkiru.com only)</small></span><input type="email" id="su_email" autocomplete="username"></div>
      <div class="mb"><span class="lab">Password</span><input type="password" id="su_pass" autocomplete="new-password"></div>
      <div class="mb"><span class="lab">Confirm password</span><input type="password" id="su_pass2" autocomplete="new-password"></div>
      <div class="mb"><span class="lab">Team access code</span><input type="text" id="su_code" autocomplete="off" placeholder="Ask your manager"></div>
      <button class="btn" id="g_up" style="width:100%">Create account</button>
    </div>

  </div>

/* signature: key out background, tint navy, trim */
function processSignature(dataURL,cb){
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement("canvas");cv.width=img.width;cv.height=img.height;
    const ctx=cv.getContext("2d");ctx.drawImage(img,0,0);
    const W=cv.width,H=cv.height,id=ctx.getImageData(0,0,W,H),d=id.data;
    let minX=W,minY=H,maxX=0,maxY=0,found=false;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const i=(y*W+x)*4,lum=(d[i]+d[i+1]+d[i+2])/3;
      const a=lum>205?0:Math.min(255,Math.round((205-lum)*1.7));
      d[i]=2;d[i+1]=20;d[i+2]=49;d[i+3]=a;
      if(a>30){found=true;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
    }
    ctx.putImageData(id,0,0);
    if(!found){cb(cv.toDataURL("image/png"));return;}
    const pad=10;minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(W-1,maxX+pad);maxY=Math.min(H-1,maxY+pad);
    const cw=maxX-minX+1,ch=maxY-minY+1;
    const c2=document.createElement("canvas");c2.width=cw;c2.height=ch;
    c2.getContext("2d").drawImage(cv,minX,minY,cw,ch,0,0,cw,ch);
    cb(c2.toDataURL("image/png"));
  };
  img.src=dataURL;
}

function docToLocal(d){
  const base={id:d.id,no:d.no,date:d.doc_date,note:d.note||"",lines:d.lines||[],
    preparedBy:d.prepared_by||"",approvedBy:d.approved_by||"",approverTitle:d.approver_title||"",
    sig:d.signature||"",status:d.status,createdBy:d.created_by||""};
  if(d.kind==="po")return Object.assign(base,{supplier:d.supplier||"",receivedDate:d.applied_date,paymentReceipt:d.payment_receipt||""});
  return Object.assign(base,{requestedBy:d.requested_by||"",project:d.project||"",purpose:d.purpose||"",issuedDate:d.applied_date});
}
async function pull(){
  const [ir,dr,br]=await Promise.all([
    SB.from(tbl("items")).select("*").order("name"),
    SB.from(tbl("documents")).select("*").order("created_at"),
    SB.from(tbl("bos_packages")).select("*").order("name")
  ]);
  if(ir.error||dr.error||br.error){ toast("Could not load data — check your connection"); setSync(false); return; }
  DB.items=(ir.data||[]).map(i=>({id:i.id,name:i.name,sku:i.sku||"",category:i.category||"",unit:i.unit||"Unit",
    qty:Number(i.qty)||0,cost:Number(i.cost)||0,reorder:Number(i.reorder)||0}));
  DB.pos=(dr.data||[]).filter(d=>d.kind==="po").map(docToLocal);
  DB.mros=(dr.data||[]).filter(d=>d.kind==="mro").map(docToLocal);
  DB.bosPackages=(br.data||[]).map(p=>({id:p.id,name:p.name,description:p.description||"",components:Array.isArray(p.components)?p.components:[]}));
  setSync(true);
}

async function signIn(){
  const email=$("g_email").value.trim(), pass=$("g_pass").value;
  if(!email||!pass){$("gateMsg").textContent="Enter your email and password";return;}
  $("gateMsg").textContent="Signing in…";
  const {data,error}=await SB.auth.signInWithPassword({email,password:pass});
  if(error){$("gateMsg").textContent=error.message;return;}
  $("gateMsg").textContent="";
  await onSignedIn(data.user);
}

function gateTab(which){
  const isSignin=which==="signin";
  $("panel_signin").style.display=isSignin?"":"none";
  $("panel_signup").style.display=isSignin?"none":"";
  $("tab_signin").style.background=isSignin?"var(--navy)":"var(--card-bg)";
  $("tab_signin").style.color=isSignin?"#fff":"var(--muted)";
  $("tab_signup").style.background=isSignin?"var(--card-bg)":"var(--navy)";
  $("tab_signup").style.color=isSignin?"var(--muted)":"#fff";
  $("gateMsg").textContent="";
}

async function signUp(){
  const cfg=window.KIRU_CONFIG||{};
  const allowedDomain=(cfg.ALLOWED_DOMAIN||"ourkiru.com").toLowerCase();
  const correctCode=(cfg.TEAM_ACCESS_CODE||"KIRU-STORES-2026");
  const email=$("su_email").value.trim().toLowerCase();
  const pass=$("su_pass").value;
  const pass2=$("su_pass2").value;
  const code=$("su_code").value.trim();
  if(!email||!pass||!pass2||!code){$("gateMsg").textContent="Please fill in all fields";return;}
  if(!email.endsWith("@"+allowedDomain)){$("gateMsg").textContent="Sign-up is restricted to @"+allowedDomain+" email addresses";return;}
  if(pass.length<8){$("gateMsg").textContent="Password must be at least 8 characters";return;}
  if(pass!==pass2){$("gateMsg").textContent="Passwords do not match";return;}
  if(code!==correctCode){$("gateMsg").textContent="Team access code is incorrect";return;}
  $("gateMsg").textContent="Creating account…";
  const {data,error}=await SB.auth.signUp({email,password:pass});
  if(error){$("gateMsg").textContent=error.message;return;}
  if(data.user&&data.session){
    $("gateMsg").textContent="";
    await onSignedIn(data.user);
  } else {
    $("gateMsg").style.color="var(--green)";
    $("gateMsg").textContent="Account created! Check your email to confirm, then sign in.";
    gateTab("signin");
    $("gateMsg").style.color="var(--green)";
  }
}

      </div>

}
function allTx(){
  const out=[];
  DB.pos.filter(p=>p.status==="received").forEach(p=>p.lines.forEach(l=>out.push({date:p.date||p.receivedDate,type:"IN",itemId:l.itemId,qty:l.qty,cost:l.cost,ref:p.no,party:p.supplier})));
  DB.mros.filter(m=>m.status==="issued").forEach(m=>m.lines.forEach(l=>{
    if(l.packageId){
      const pkg=pkgById(l.packageId);
      (pkg?pkg.components:[]).forEach(c=>{
        const it=itemById(c.itemId);
        out.push({date:m.date||m.issuedDate,type:"OUT",itemId:c.itemId,qty:(c.qty||0)*(l.qty||0),cost:it?it.cost:0,ref:m.no,party:m.project||m.requestedBy});
      });
    } else {
      const it=itemById(l.itemId);
      out.push({date:m.date||m.issuedDate,type:"OUT",itemId:l.itemId,qty:l.qty,cost:it?it.cost:0,ref:m.no,party:m.project||m.requestedBy});
    }
  }));
  return out.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
}

let stockSelected=new Set();
let stockRepFrom="",stockRepTo="";
function openStockExportModal(){
  const items=DB.items.slice().sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:"base"}));
  if(!items.length){toast("No stock items yet");return;}
  stockSelected=new Set();
  if(!stockRepFrom){const d=new Date();d.setMonth(d.getMonth()-1);stockRepFrom=d.toISOString().slice(0,10);}
  if(!stockRepTo)stockRepTo=today();
  $("modalInner").innerHTML=`<h3>Download stock report</h3><div class="sub">Select one or more stock items and a date range, then view or download the report.</div>
    <div class="row2 mb" style="margin-top:10px">
      <div><span class="lab">From</span><input type="date" id="st_from" value="${stockRepFrom}"></div>
      <div><span class="lab">To</span><input type="date" id="st_to" value="${stockRepTo}"></div>
    </div>
    <div class="mb"><input id="st_filter" placeholder="Filter items…"></div>
    <div class="btnrow" style="margin-bottom:8px"><button class="btn ghost sm" id="st_all">Select all</button><button class="btn ghost sm" id="st_none">Clear</button></div>
    <div id="st_list" style="max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px"></div>
    <div class="btnrow" style="margin-top:14px"><button class="btn" id="st_view">View report</button><button class="btn ghost" id="st_cancel">Cancel</button></div>`;
  function matchesQ(it,ql){return !ql||(it.name+" "+(it.sku||"")+" "+(it.category||"")).toLowerCase().includes(ql);}
  function renderStList(q){
    const ql=(q||"").trim().toLowerCase();
    const filtered=items.filter(it=>matchesQ(it,ql));
    $("st_list").innerHTML=filtered.map(it=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer">
      <input type="checkbox" class="st_cb" value="${it.id}" ${stockSelected.has(it.id)?'checked':''}>
      <span style="flex:1">${esc(it.name)}${it.sku?`<span style="color:var(--muted);font-size:.78rem"> · ${esc(it.sku)}</span>`:''}</span>
      <span style="color:var(--muted);font-size:.8rem">${n2(it.qty)} ${esc(it.unit||'')}</span></label>`).join("")||'<div class="empty">No items match</div>';
    $("st_list").querySelectorAll(".st_cb").forEach(cb=>cb.addEventListener("change",()=>{
      if(cb.checked)stockSelected.add(cb.value); else stockSelected.delete(cb.value);
    }));
  }
  renderStList("");
  $("modal").classList.add("show");
  $("st_filter").addEventListener("input",e=>renderStList(e.target.value));
  $("st_from").addEventListener("input",e=>stockRepFrom=e.target.value);
  $("st_to").addEventListener("input",e=>stockRepTo=e.target.value);
  $("st_all").addEventListener("click",()=>{
    const ql=($("st_filter").value||"").trim().toLowerCase();
    items.filter(it=>matchesQ(it,ql)).forEach(it=>stockSelected.add(it.id));
    renderStList($("st_filter").value);
  });
  $("st_none").addEventListener("click",()=>{stockSelected=new Set();renderStList($("st_filter").value);});

function renderBosLines(){
  const c=$("bosRows"); if(!c)return; c.innerHTML="";
  draft.components.forEach((cmp,idx)=>{
    const it=itemById(cmp.itemId);
    const unitCost=it?ngn.format(it.cost||0):"—";
    const r=document.createElement("div"); r.className="lineitem cols-po";
    r.innerHTML=`<select data-i="${idx}" data-f="itemId"><option value="">— select item —</option>
        ${DB.items.map(i=>`<option value="${i.id}" ${i.id===cmp.itemId?'selected':''}>${esc(i.name)}${i.sku?' ('+esc(i.sku)+')':''}</option>`).join("")}</select>
      <input class="num" type="number" data-i="${idx}" data-f="qty" value="${cmp.qty}">
      <div style="font-size:.78rem;font-weight:700;text-align:right;color:var(--muted)">${unitCost}</div>
      <button class="delbtn" data-del="${idx}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>`;
    c.appendChild(r);
  });
  c.querySelectorAll("select,input").forEach(el=>el.addEventListener("input",e=>{
    const i=+e.target.dataset.i,f=e.target.dataset.f;
    if(f==="qty") draft.components[i].qty=parseFloat(e.target.value)||0;
    else { draft.components[i].itemId=e.target.value; renderBosLines(); }
    updateBosTotal();
  }));
  c.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{draft.components.splice(+b.dataset.del,1);renderBosLines();updateBosTotal();}));

function updateBosTotal(){
  const el=$("bosTotal"); if(!el)return;
  const total=draft.components.reduce((s,c)=>{const it=itemById(c.itemId);return s+(c.qty||0)*(it?it.cost||0:0);},0);
  el.textContent=ngn.format(total);
}
function bosForm(){
  const isEdit=!!draft._isEdit;
  $("view").innerHTML=`
    <div class="split">
      <div class="card pad stick">
        <h3>${isEdit?"Edit package":"Create BOS package"}</h3><div class="sub">Price is the live sum of component stock costs — updates automatically as item costs change.</div>
        <div class="mb"><span class="lab">Package name</span><input id="b_name" value="${esc(draft.name)}" placeholder="e.g. Standard 5kW BOS Package"></div>

        <div class="btnrow"><button class="btn" id="b_save">${isEdit?"Update package":"Save package"}</button><button class="btn ghost" id="b_cancel">Cancel</button></div>
      </div>
      <div class="card pad">
        <h3>Components</h3><div class="sub"><b id="bosTotal">₦0</b> total</div>

        <div id="bosRows"></div>

  renderBosLines();
  $("b_name").addEventListener("input",e=>draft.name=e.target.value);
  $("b_desc").addEventListener("input",e=>draft.description=e.target.value);
  $("addBosLine").addEventListener("click",()=>{draft.components.push({itemId:"",qty:1});renderBosLines();});
  $("b_cancel").addEventListener("click",()=>{draft=null;viewBOS();});
  $("b_save").addEventListener("click",async()=>{
    const name=$("b_name").value.trim(); if(!name){toast("Enter a package name");return;}

    if(!components.length){toast("Add at least one component");return;}

    if(isEdit){
      const ok=await updatePackageDB(draft.id,payload);
      if(ok){toast("Package updated");draft=null;viewBOS();}
    } else {
      const ok=await addPackageDB(payload);
      if(ok){toast("Package saved");draft=null;viewBOS();}
    }
  });
}

<script>
/* ============ SHARED DOC LINE EDITOR ============ */
function lineEditor(kind){
  const showCost=kind==="po", cls=showCost?"cols-po":"cols-mro";
  const header=showCost
    ? `<span>Item</span><span>Qty</span><span>Unit cost (₦)</span><span></span>`
    : `<span>Item</span><span>Qty</span><span>Available</span><span>Unit cost (₦)</span><span></span>`;
  return `<div class="linehead ${cls}">${header}</div>
    <div id="lineRows"></div>
    <button class="btn ghost sm" id="addLine" style="width:100%;border-style:dashed;margin-top:3px">+ Add line</button>`;
}
function pkgById(id){return DB.bosPackages.find(p=>p.id===id);}
function packageFulfillable(pkg){
  if(!pkg||!(pkg.components||[]).length) return 0;
  return Math.min(...pkg.components.map(c=>{
    const it=itemById(c.itemId);
    return (it&&c.qty>0) ? Math.floor((it.qty||0)/c.qty) : 0;
  }));
}
function renderLines(kind){
  const showCost=kind==="po", cls=showCost?"cols-po":"cols-mro", c=$("lineRows"); if(!c)return; c.innerHTML="";
  draft.lines.forEach((l,idx)=>{
    const r=document.createElement("div"); r.className="lineitem "+cls;
    if(l.packageId){
      const pkg=pkgById(l.packageId);
      const unitCost=pkg?ngn.format(packageCost(pkg)):"—";
      const fulfillable=pkg?packageFulfillable(pkg):0;
      r.innerHTML=`<div style="font-size:.82rem;font-weight:700;padding:8px 0">🧩 ${esc(pkg?pkg.name:"(package removed)")}<div style="font-size:.66rem;color:var(--muted);font-weight:500">BOS package · ${pkg?(pkg.components||[]).length:0} components</div></div>
        <input class="num" type="number" data-i="${idx}" data-f="qty" value="${l.qty}">
        ${showCost?`<div style="font-size:.78rem;font-weight:700;text-align:right;color:var(--muted)" title="Live package cost — receiving a package doesn't override each component's registered cost">${unitCost}</div>`
                  :`<div style="font-size:.78rem;font-weight:700;text-align:center;color:${fulfillable<(l.qty||0)?'var(--red)':'var(--muted)'}">${fulfillable} pkgs</div>
                    <div style="font-size:.78rem;font-weight:700;text-align:right;color:var(--muted)">${unitCost}</div>`}
        <button class="delbtn" data-del="${idx}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>`;
    } else {
      const it=itemById(l.itemId);
      const avail=it?`${n2(it.qty)} ${esc(it.unit||"")}`:"—";
      const unitCost=it?ngn.format(it.cost||0):"—";
      r.innerHTML=`<select data-i="${idx}" data-f="itemId"><option value="">— select item —</option>
          ${DB.items.map(i=>`<option value="${i.id}" ${i.id===l.itemId?'selected':''}>${esc(i.name)}${i.sku?' ('+esc(i.sku)+')':''}</option>`).join("")}</select>
        <input class="num" type="number" data-i="${idx}" data-f="qty" value="${l.qty}">
        ${showCost?`<input class="num" type="text" inputmode="numeric" data-i="${idx}" data-f="cost" value="${Number(l.cost||0).toLocaleString('en-US')}">`
                  :`<div style="font-size:.78rem;font-weight:700;text-align:center;color:${it&&(it.qty||0)<(l.qty||0)?'var(--red)':'var(--muted)'}">${avail}</div>
                    <div style="font-size:.78rem;font-weight:700;text-align:right;color:var(--muted)">${unitCost}</div>`}
        <button class="delbtn" data-del="${idx}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>`;
    }
    c.appendChild(r);
  });
  c.querySelectorAll("select,input").forEach(el=>el.addEventListener("input",e=>{
    const i=+e.target.dataset.i,f=e.target.dataset.f;
    if(f==="cost"){fmtCommasEl(e.target);draft.lines[i].cost=parseFloat(e.target.value.replace(/,/g,""))||0; updateDocTotal(kind);}
    else if(f==="qty"){draft.lines[i].qty=parseFloat(e.target.value)||0; updateDocTotal(kind);}
    else{ draft.lines[i].itemId=e.target.value; const it=itemById(e.target.value); if(it&&!draft.lines[i].cost)draft.lines[i].cost=it.cost||0; renderLines(kind); updateDocTotal(kind); }
  }));
  c.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{draft.lines.splice(+b.dataset.del,1);renderLines(kind);updateDocTotal(kind);}));
  updateDocTotal(kind);
}
function docTotal(){return draft.lines.reduce((s,l)=>{
  if(l.packageId){ const pkg=pkgById(l.packageId); return s+(l.qty||0)*(pkg?packageCost(pkg):0); }
  return s+(l.qty||0)*(l.cost||0);
},0);}
function docTotalFromStock(){return draft.lines.reduce((s,l)=>{
  if(l.packageId){ const pkg=pkgById(l.packageId); return s+(l.qty||0)*(pkg?packageCost(pkg):0); }
  const it=itemById(l.itemId); return s+(l.qty||0)*(it?it.cost||0:0);
},0);}
function updateDocTotal(kind){
  const el=$("docTotal"); if(!el)return;
  el.textContent = kind==="po" ? ngn.format(docTotal())
    : `${draft.lines.length} line${draft.lines.length===1?'':'s'} · ${ngn.format(docTotalFromStock())}`;
}
function sigBlock(){
  return `<div class="row2 mb">
      <div><span class="lab">Approved by</span><input id="d_appr" value="${esc(draft.approvedBy||"")}"></div>
      <div><span class="lab">Approver title</span><input id="d_title" value="${esc(draft.approverTitle||"")}"></div>
    </div>
    <div class="mb"><span class="lab">Signature <small>(upload — background removed automatically)</small></span>
      <label class="upbtn">Upload signature<input type="file" id="d_sigFile" accept="image/*" style="display:none"></label>
      <img id="d_sigThumb" class="upthumb${draft.sig?' show':''}"${draft.sig?` src="${draft.sig}"`:''}>
      <button class="btn ghost sm" id="d_sigClear" style="margin-top:8px;display:${draft.sig?'inline-block':'none'}">Remove signature</button>
    </div>`;
}
function applyDraftSig(dataURL){
  draft.sig=dataURL||null;
  const th=$("d_sigThumb"); if(!th)return;
  if(dataURL){ th.src=dataURL; th.classList.add("show"); $("d_sigClear").style.display="inline-block"; }
  else { th.classList.remove("show"); th.removeAttribute("src"); $("d_sigClear").style.display="none"; }
}
function wireSig(){
  ["d_appr","d_title"].forEach(id=>$(id)&&$(id).addEventListener("input",e=>{
    draft[{d_appr:"approvedBy",d_title:"approverTitle"}[id]]=e.target.value;
  }));
  const fileInp=$("d_sigFile");
  if(fileInp)fileInp.addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>processSignature(r.result,out=>applyDraftSig(out));
    r.readAsDataURL(f);
  });
  const clearBtn=$("d_sigClear");
  if(clearBtn)clearBtn.addEventListener("click",()=>{ $("d_sigFile").value=""; applyDraftSig(""); });
}

/* ============ PURCHASE ORDERS ============ */
let poFilter="",poSort="";
const PO_SORTS=[
  ["","Newest first"],
  ["date_desc","Date (newest)"],
  ["date_asc","Date (oldest)"],
  ["supplier_asc","Supplier (A–Z)"],
  ["supplier_desc","Supplier (Z–A)"],
  ["no_asc","PO No. (A–Z)"],
  ["no_desc","PO No. (Z–A)"],
  ["value_desc","Value (highest)"],
  ["value_asc","Value (lowest)"],
  ["status","Status (Draft first)"]
];
function poValue(p){return p.lines.reduce((s,l)=>{
  if(l.packageId){ const pkg=pkgById(l.packageId); return s+(l.qty||0)*(pkg?packageCost(pkg):0); }
  return s+(l.qty||0)*(l.cost||0);
},0);}
function sortPos(list){
  const arr=list.slice();
  const cmp=(x,y)=>x.localeCompare(y,undefined,{numeric:true,sensitivity:"base"});
  switch(poSort){
    case "date_desc": arr.sort((a,b)=>cmp(b.date||"",a.date||"")); break;
    case "date_asc": arr.sort((a,b)=>cmp(a.date||"",b.date||"")); break;
    case "supplier_asc": arr.sort((a,b)=>cmp(a.supplier||"",b.supplier||"")); break;
    case "supplier_desc": arr.sort((a,b)=>cmp(b.supplier||"",a.supplier||"")); break;
    case "no_asc": arr.sort((a,b)=>cmp(a.no||"",b.no||"")); break;
    case "no_desc": arr.sort((a,b)=>cmp(b.no||"",a.no||"")); break;
    case "value_desc": arr.sort((a,b)=>poValue(b)-poValue(a)); break;
    case "value_asc": arr.sort((a,b)=>poValue(a)-poValue(b)); break;
    case "status": arr.sort((a,b)=>cmp(a.status||"",b.status||"")); break;
    default: arr.reverse();
  }
  return arr;
}
function viewPO(){
  if(draft&&draft.kind==="po"){return poForm();}
  const q=poFilter.trim().toLowerCase();
  const list=sortPos(DB.pos.filter(p=>!q||[p.no,p.supplier].filter(Boolean).join(" ").toLowerCase().includes(q)));
  $("view").innerHTML=`
    <div class="card pad">
      <div class="btnrow" style="justify-content:space-between;margin-bottom:14px">
        <div><h3>Purchase Orders</h3><div class="sub" style="margin:0">Receiving a purchase order adds its items to stock.</div></div>
        <div class="btnrow">
          <button class="btn ghost" id="expSup">⬇ Download by supplier</button>
          <button class="btn" id="newPO">+ Create purchase order</button>
        </div>
      </div>
      <div class="searchbar" style="margin-bottom:14px">
        <input id="p_search" placeholder="Search PO no. or supplier" value="${esc(poFilter)}">
        <select id="p_sort">${PO_SORTS.map(([v,l])=>`<option value="${v}" ${poSort===v?'selected':''}>${l}</option>`).join("")}</select>
      </div>
      ${list.length?`<table class="grid"><thead><tr><th class="l">PO No.</th><th class="l">Supplier</th><th class="l">Date</th><th>Lines</th><th>Value</th><th class="c">Receipt</th><th class="c">Status</th><th class="c">Actions</th></tr></thead><tbody>
        ${list.map(p=>`<tr>
          <td class="l">${esc(p.no)}</td><td class="l" style="font-weight:500">${esc(p.supplier||"—")}</td><td class="l" style="font-weight:500">${fmtDate(p.date)}</td>
          <td>${p.lines.length}</td><td>${ngn.format(poValue(p))}</td>
          <td class="c">
            ${p.paymentReceipt
              ? `<a href="${p.paymentReceipt}" target="_blank" title="View receipt"><img src="${p.paymentReceipt}" style="max-height:36px;max-width:60px;border-radius:4px;border:1px solid var(--line);cursor:pointer"></a>`
              : `<label class="btn ghost sm" style="cursor:pointer" title="Upload payment receipt">📎 Upload<input type="file" accept="image/*,application/pdf" style="display:none" data-receipt="${p.id}"></label>`}
          </td>
          <td class="c"><span class="pill ${p.status==='received'?'done':'draft'}">${p.status==='received'?'RECEIVED':'DRAFT'}</span></td>
          <td class="c"><div class="btnrow" style="justify-content:center">
            <button class="btn ghost sm" data-view="${p.id}">View</button>
            <button class="btn ghost sm" data-edit-po="${p.id}">Edit</button>
            ${p.status!=='received'?`<button class="btn sm" data-recv="${p.id}">Receive</button>`:''}
            <button class="btn ghost sm" data-print="${p.id}">Download</button>
            ${isAdmin()?`<button class="btn danger sm" data-del-po="${p.id}" title="Delete PO">Delete</button>`:''}
          </div></td></tr>`).join("")}
      </tbody></table>`:`<div class="empty">${q?"No purchase orders match your search.":"No purchase orders yet."}</div>`}
    </div>`;
  $("p_search").addEventListener("input",e=>{poFilter=e.target.value;const p=e.target.selectionStart;viewPO();const s=$("p_search");s.focus();s.setSelectionRange(p,p);});
  $("p_sort").addEventListener("change",e=>{poSort=e.target.value;viewPO();});
  $("expSup").addEventListener("click",openSupplierExportModal);
  $("newPO").addEventListener("click",()=>{
    if(!DB.items.length){toast("Add stock items first");return;}
    draft={kind:"po",id:uid(),no:"",date:today(),supplier:"",note:"",lines:[{itemId:"",qty:1,cost:0}],preparedBy:"",approvedBy:"",approverTitle:"",sig:null};
    viewPO();
  });
  $("view").querySelectorAll("[data-recv]").forEach(b=>b.addEventListener("click",()=>receivePO(b.dataset.recv)));
  $("view").querySelectorAll("[data-print]").forEach(b=>b.addEventListener("click",()=>printDoc(docHTML_PO(DB.pos.find(x=>x.id===b.dataset.print)))));
  $("view").querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>previewDoc(docHTML_PO(DB.pos.find(x=>x.id===b.dataset.view)))));
  $("view").querySelectorAll("[data-edit-po]").forEach(b=>b.addEventListener("click",async()=>{
    const p=DB.pos.find(x=>x.id===b.dataset.editPo); if(!p)return;
    if(p.status==="received"){
      if(!confirm(`${p.no} has already been received and its stock added. Editing it will reverse that stock, and you'll need to receive it again after making your changes. Continue?`))return;
      const ok=await unissueDocDB(p.id); if(!ok)return;
    }
    const fresh=DB.pos.find(x=>x.id===b.dataset.editPo); if(!fresh)return;
    draft={kind:"po",id:fresh.id,no:fresh.no,date:fresh.date,supplier:fresh.supplier,note:fresh.note,lines:fresh.lines.map(l=>({...l})),
      preparedBy:fresh.preparedBy,approvedBy:fresh.approvedBy,approverTitle:fresh.approverTitle,sig:fresh.sig};
    viewPO();
  }));
  $("view").querySelectorAll("[data-receipt]").forEach(inp=>inp.addEventListener("change",async()=>{
    const file=inp.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=async e=>{
      const ok=await uploadReceiptDB(inp.dataset.receipt,e.target.result);
      if(ok){toast("Payment receipt uploaded"); viewPO();}
    };
    reader.readAsDataURL(file);
  }));
  $("view").querySelectorAll("[data-del-po]").forEach(b=>b.addEventListener("click",async()=>{
    const p=DB.pos.find(x=>x.id===b.dataset.delPo);
    if(!p)return;
    if(!confirm("Permanently delete "+p.no+"? This cannot be undone."))return;
    const ok=await deleteDocDB(p.id);
    if(ok){toast(p.no+" deleted"); viewPO();}
  }));
}
function supplierList(){
  const set=new Set();
  DB.pos.forEach(p=>{ const s=(p.supplier||"").trim(); if(s) set.add(s); });
  return [...set].sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"}));
}
let supSelected=new Set();
function openSupplierExportModal(){
  const suppliers=supplierList();
  if(!suppliers.length){toast("No suppliers recorded yet");return;}
  supSelected=new Set();
  $("modalInner").innerHTML=`<h3>Download by supplier</h3><div class="sub">Select one or more suppliers to download all their purchase orders as a single report.</div>
    <div class="mb" style="margin-top:10px"><input id="sup_filter" placeholder="Filter suppliers…"></div>
    <div class="btnrow" style="margin-bottom:8px"><button class="btn ghost sm" id="sup_all">Select all</button><button class="btn ghost sm" id="sup_none">Clear</button></div>
    <div id="sup_list" style="max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px"></div>

  function renderSupList(q){
    const ql=(q||"").trim().toLowerCase();
    const filtered=suppliers.filter(s=>!ql||s.toLowerCase().includes(ql));
    $("sup_list").innerHTML=filtered.map(s=>{
      const count=DB.pos.filter(p=>(p.supplier||"").trim()===s).length;

let mroFilter="",mroSort="";
const MRO_SORTS=[
  ["","Newest first"],
  ["date_desc","Date (newest)"],
  ["date_asc","Date (oldest)"],
  ["name_asc","Customer Name (A–Z)"],
  ["name_desc","Customer Name (Z–A)"],
  ["no_asc","MRO No. (A–Z)"],
  ["no_desc","MRO No. (Z–A)"],
  ["requester_asc","Requested by (A–Z)"],
  ["status","Status (Draft first)"]
];
function sortMros(list){
  const arr=list.slice();
  const cmp=(x,y)=>x.localeCompare(y,undefined,{numeric:true,sensitivity:"base"});
  switch(mroSort){
    case "date_desc": arr.sort((a,b)=>cmp(b.date||"",a.date||"")); break;
    case "date_asc": arr.sort((a,b)=>cmp(a.date||"",b.date||"")); break;
    case "name_asc": arr.sort((a,b)=>cmp(a.project||"",b.project||"")); break;
    case "name_desc": arr.sort((a,b)=>cmp(b.project||"",a.project||"")); break;
    case "no_asc": arr.sort((a,b)=>cmp(a.no||"",b.no||"")); break;
    case "no_desc": arr.sort((a,b)=>cmp(b.no||"",a.no||"")); break;
    case "requester_asc": arr.sort((a,b)=>cmp(a.requestedBy||"",b.requestedBy||"")); break;
    case "status": arr.sort((a,b)=>cmp(a.status||"",b.status||"")); break;
    default: arr.reverse();
  }
  return arr;
}

function lineShortfall(l){
  if(l.packageId){
    const pkg=pkgById(l.packageId);
    if(!pkg) return true;
    return (pkg.components||[]).some(c=>{const it=itemById(c.itemId);return !it||(it.qty||0)<(c.qty||0)*(l.qty||0);});
  }
  const it=itemById(l.itemId);
  return !it||(it.qty||0)<(l.qty||0);
}
function lineLabel(l){
  if(l.packageId){const pkg=pkgById(l.packageId);return pkg?pkg.name:"unknown package";}
  const it=itemById(l.itemId);return it?it.name:"unknown item";
}
async function issueMRO(id){
  const m=DB.mros.find(x=>x.id===id); if(!m||m.status==="issued")return;
  const short=m.lines.filter(lineShortfall);
  if(short.length){
    const names=short.map(lineLabel).join(", ");
    if(!confirm("Insufficient stock for: "+names+".\nIssue anyway (stock will go negative)?"))return;
  } else if(!confirm("Issue "+m.no+"? This removes the items from stock.")) return;
  const ok=await applyDocDB(id); if(ok){toast(m.no+" issued — stock updated"); viewMRO();}
}

<script>
/* ============ DOCUMENT RENDERERS ============ */

function poLineRows(p){

function renderRepPreview(){$("repPreview").innerHTML=reportHTML();}
function computeStockRows(items,from,to){
  const tx=allTx();
  return items.map(it=>{
    const mine=tx.filter(t=>t.itemId===it.id);
    const inAfterFrom=mine.filter(t=>t.type==="IN"&&t.date>=from).reduce((s,t)=>s+(t.qty||0),0);
    const outAfterFrom=mine.filter(t=>t.type==="OUT"&&t.date>=from).reduce((s,t)=>s+(t.qty||0),0);
    const opening=(it.qty||0)-inAfterFrom+outAfterFrom;
    const rin=mine.filter(t=>t.type==="IN"&&t.date>=from&&t.date<=to).reduce((s,t)=>s+(t.qty||0),0);
    const rout=mine.filter(t=>t.type==="OUT"&&t.date>=from&&t.date<=to).reduce((s,t)=>s+(t.qty||0),0);
    const closing=opening+rin-rout;
    const inVal=mine.filter(t=>t.type==="IN"&&t.date>=from&&t.date<=to).reduce((s,t)=>s+(t.qty||0)*(t.cost||0),0);
    const outVal=mine.filter(t=>t.type==="OUT"&&t.date>=from&&t.date<=to).reduce((s,t)=>s+(t.qty||0)*(t.cost||0),0);
    return {it,opening,rin,rout,closing,inVal,outVal};
  });
}
